spring.application.name=api

# # Database Configuration - MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/fullcontrol
# spring.datasource.username=root

# SENHA IMPORTANTE 
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# H2 CONFIGURACAO 
spring.datasource.url=jdbc:h2:mem:imobiliariadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
# spring.datasource.password=

# ATIVA O CONSOLE WEB DO H2 PARA TESTES 
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualiza o banco automaticamente com base nas suas entidades @Entity